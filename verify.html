<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify a Certificate — iCorporate</title>
<meta name="description" content="Verify the authenticity of an iCorporate internship or training certificate.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1220;
    --bg-panel:#121B2E;
    --bg-panel-2:#0F1626;
    --text:#E7ECF3;
    --text-dim:#8493AA;
    --text-dimmer:#5A6B85;
    --accent:#4FD1C5;
    --accent-warm:#F5A25D;
    --danger:#F5716A;
    --line:#233150;
    --line-soft:#1A2540;
    --radius:10px;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    line-height:1.6;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:640px; margin:0 auto; padding:0 24px; width:100%;}

  header{padding:24px 0; border-bottom:1px solid var(--line-soft);}
  .logo{
    display:flex; align-items:center; gap:10px;
    font-family:var(--font-mono); font-size:15px; font-weight:600;
  }
  .logo svg{width:24px; height:24px;}

  main{flex:1; display:flex; align-items:center; padding:60px 0;}
  .panel{width:100%;}

  .eyebrow{
    font-family:var(--font-mono); font-size:12px; color:var(--accent);
    letter-spacing:0.08em; margin-bottom:14px;
  }
  h1{
    font-family:var(--font-display); font-size:clamp(28px,4vw,38px);
    font-weight:600; margin-bottom:12px; letter-spacing:-0.01em;
  }
  .sub{color:var(--text-dim); font-size:15px; margin-bottom:36px;}

  .search-row{display:flex; gap:10px; margin-bottom:8px;}
  input[type="text"]{
    flex:1;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px 16px;
    color:var(--text);
    font-family:var(--font-mono);
    font-size:14px;
  }
  input[type="text"]:focus{outline:2px solid var(--accent); outline-offset:1px;}
  input[type="text"]::placeholder{color:var(--text-dimmer);}
  button{
    background:var(--accent);
    color:#08151A;
    border:none;
    border-radius:6px;
    padding:14px 24px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    font-family:var(--font-body);
  }
  button:hover{filter:brightness(1.05);}
  .hint{font-size:12.5px; color:var(--text-dimmer); margin-bottom:8px;}

  .result{
    margin-top:28px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--bg-panel);
    padding:28px;
    display:none;
  }
  .result.show{display:block;}
  .status-row{display:flex; align-items:center; gap:10px; margin-bottom:20px;}
  .status-dot{width:9px; height:9px; border-radius:50%;}
  .status-dot.valid{background:var(--accent); box-shadow:0 0 0 4px rgba(79,209,197,0.15);}
  .status-dot.invalid{background:var(--danger); box-shadow:0 0 0 4px rgba(245,113,106,0.15);}
  .status-label{font-family:var(--font-mono); font-size:13px; letter-spacing:0.05em;}
  .status-label.valid{color:var(--accent);}
  .status-label.invalid{color:var(--danger);}

  .field-row{
    display:flex; justify-content:space-between; gap:16px;
    padding:12px 0; border-bottom:1px solid var(--line-soft);
    font-size:14px;
  }
  .field-row:last-child{border-bottom:none;}
  .field-k{color:var(--text-dimmer); font-family:var(--font-mono); font-size:11px; letter-spacing:0.04em;}
  .field-v{color:var(--text); text-align:right;}

  .not-found-msg{color:var(--text-dim); font-size:14px;}
  .not-found-msg a{color:var(--accent);}

  footer{
    border-top:1px solid var(--line-soft);
    padding:24px 0;
    text-align:center;
  }
  footer p{color:var(--text-dimmer); font-size:12.5px;}
  footer a{color:var(--accent);}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a href="/" class="logo">
      <svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="400" cy="400" r="400" fill="#0B1220"/>
        <circle cx="400" cy="400" r="290" fill="none" stroke="#4FD1C5" stroke-width="26"
          stroke-linecap="round" stroke-dasharray="1680 1822" transform="rotate(-90 400 400)"/>
        <circle cx="400" cy="110" r="30" fill="#4FD1C5"/>
      </svg>
      iCorporate
    </a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="panel">
      <span class="eyebrow">CERTIFICATE VERIFICATION</span>
      <h1>Verify a certificate.</h1>
      <p class="sub">Enter the certificate number found at the bottom of any iCorporate internship or training certificate.</p>

      <div class="search-row">
        <input type="text" id="certInput" placeholder="e.g. ICORP-INT-0007" autocomplete="off">
        <button onclick="verifyCert()">Verify</button>
      </div>
      <p class="hint">Certificate numbers are case-insensitive.</p>

      <div class="result" id="result"></div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <p>Believe this is an error? Email <a href="mailto:admin@icorporate.net">admin@icorporate.net</a></p>
  </div>
</footer>

<script>
  let certData = [];

  fetch('/certificates.json')
    .then(r => r.json())
    .then(data => { certData = data; })
    .catch(() => { certData = []; });

  function verifyCert(){
    const input = document.getElementById('certInput').value.trim().toUpperCase();
    const resultBox = document.getElementById('result');
    if(!input){ return; }

    const match = certData.find(c => c.id.toUpperCase() === input);

    if(match && match.status === 'valid'){
      resultBox.innerHTML = `
        <div class="status-row">
          <span class="status-dot valid"></span>
          <span class="status-label valid">CERTIFICATE VALID</span>
        </div>
        <div class="field-row"><span class="field-k">RECIPIENT</span><span class="field-v">${escapeHtml(match.name)}</span></div>
        <div class="field-row"><span class="field-k">PROGRAM</span><span class="field-v">${escapeHtml(match.track)}</span></div>
        <div class="field-row"><span class="field-k">DURATION</span><span class="field-v">${escapeHtml(match.start)} — ${escapeHtml(match.end)}</span></div>
        <div class="field-row"><span class="field-k">ISSUED</span><span class="field-v">${escapeHtml(match.issued)}</span></div>
        <div class="field-row"><span class="field-k">CERTIFICATE NO.</span><span class="field-v">${escapeHtml(match.id)}</span></div>
      `;
    } else {
      resultBox.innerHTML = `
        <div class="status-row">
          <span class="status-dot invalid"></span>
          <span class="status-label invalid">NO RECORD FOUND</span>
        </div>
        <p class="not-found-msg">No certificate matches that number. Double-check it and try again, or email <a href="mailto:admin@icorporate.net">admin@icorporate.net</a> if you believe this is an error.</p>
      `;
    }
    resultBox.classList.add('show');
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  document.getElementById('certInput').addEventListener('keydown', e => {
    if(e.key === 'Enter'){ verifyCert(); }
  });
</script>

</body>
</html>
